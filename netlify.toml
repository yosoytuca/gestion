[build]
  command = "npm run build:production"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Ports, model names and debug settings are public configuration.
  # Keep scanning enabled for AI_API_KEY and all other secrets.
  SECRETS_SCAN_OMIT_KEYS = "DEV_HOST,DEV_PORT,AI_PROVIDER,AI_MODEL,AI_VOICE_MODEL,AI_DEBUG,AI_ALLOWED_ORIGIN"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
